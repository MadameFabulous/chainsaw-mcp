# Use with: docker compose -f compose.yaml -f deploy/compose.nfs.yaml up -d
services:
  chainsaw:
    volumes:
      - type: volume
        source: remote_evidence
        target: /evidence
        read_only: true
        volume:
          nocopy: true

volumes:
  remote_evidence:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=${NFS_SERVER:?Set NFS_SERVER},nfsvers=4,ro,nosuid,nodev"
      device: ":${NFS_EXPORT:?Set NFS_EXPORT}"
