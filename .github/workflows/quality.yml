name: quality
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    name: unit-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CHAINSAW_JEV_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.12.19'
          python-version: '3.11'
          enable-cache: false
      - name: Locked unit, lint, types, coverage, docs, shell, and package gates
        run: |
          git rev-parse HEAD
          bash scripts/quality-check.sh
  integration:
    name: real-chainsaw-integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.12.19'
          python-version: '3.11'
          enable-cache: false
      - name: Download the pinned Chainsaw bundle and sample set, run the integration tier
        run: |
          git rev-parse HEAD
          bash scripts/integration-check.sh
